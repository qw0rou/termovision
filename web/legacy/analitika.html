<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Теплосеть: Реестр Домов (v5.6 - Аналитика на IDB)</title>
<style>
/* Base Styles */
:root{--bg:#fff;--ink:#111;--muted:#666;--line:#e9e9ee;--accent:#3b82f6;--ok:#10b981;--warn:#f59e0b;--red:#ef4444;--panel:#f9fafb;--shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px 0 rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark) {
  :root{--bg:#0f172a;--ink:#f1f5f9;--muted:#94a3b8;--line:#475569;--panel:#1e293b;--shadow:none}
  body{background:var(--bg);color:var(--ink)}
  header{background:var(--bg);border-bottom:1px solid var(--line)}
  input,select,textarea{background:var(--panel);color:var(--ink);border-color:var(--line)}
  button{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{background:var(--panel);border-color:var(--line)}
  table th{background:var(--panel)}
  .is-out{background:rgba(239,68,68,0.1) !important;}
}

*{box-sizing:border-box}
body{margin:0;padding:0;font:14px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Arial}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 20px;z-index:10;box-shadow:var(--shadow)}
h1{margin:0;font-size:20px}
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.badge{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.badge-red{color:var(--red)}
.badge-loss{color:#f43f5e; background:rgba(244,63,94,0.1); border-color:rgba(244,63,94,0.3);}
input,select,button,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px}
button{cursor:pointer;background:var(--accent);color:#fff;border-color:var(--accent);transition:background 0.2s}
.btn-warn{background:var(--warn);color:var(--ink);border-color:var(--warn)}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn-quick{background:#38bdf8; color:white; border-color:#38bdf8; font-size:13px; padding: 7px 10px;}

main{padding:20px;max-width:1400px;margin:0 auto; padding-top: 0; }
.panel{border:1px solid var(--line);border-radius:10px;padding:20px;background:var(--panel);margin-bottom:20px;box-shadow:var(--shadow)}

/* Стили для оперативной сводки */
#operativeSummary { background: rgba(56, 189, 248, 0.05); border-color: #38bdf8; margin-top: 20px;}
#operativeSummary h3 { margin-top: 0; font-size: 16px; border-bottom: 1px dashed var(--line); padding-bottom: 10px; color: var(--ink); }
.summary-grid { display: flex; gap: 15px; flex-wrap: wrap; }
.summary-card { background: var(--bg); border: 1px solid var(--line); padding: 12px; border-radius: 8px; flex: 1; min-width: 260px; box-shadow: var(--shadow); }
.summary-card summary { cursor: pointer; color: var(--accent); font-weight: 500; margin-top: 8px; outline: none; }
.summary-card details[open] summary { margin-bottom: 6px; }

#historicalAnalyticsSummary h2 { margin-top: 0; font-size: 18px; border-bottom: 1px dashed var(--line); padding-bottom: 10px; }
.report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 15px; }
.report-item { padding: 10px 15px; border: 1px solid var(--line); border-radius: 8px; }
.report-item p { margin: 4px 0; }
.report-value { font-size: 24px; font-weight: 700; color: var(--red); display: block; margin-top: 5px; }
.source-list p { display: flex; justify-content: space-between; margin: 6px 0; padding-bottom: 3px; border-bottom: 1px dotted rgba(0,0,0,0.1); }
@media (prefers-color-scheme: dark) { .source-list p { border-bottom: 1px dotted rgba(255,255,255,0.1); } }

table{width:100%;border-collapse:collapse;margin-top:0;font-size:13px}
table th, table td{padding:10px;border:1px solid var(--line);text-align:left}
table th{background:var(--panel);font-weight:600;position: sticky;top: 0;z-index: 5;}
.clickable{cursor:pointer}
.is-out{background:rgba(239,68,68,0.05)}
.ok{background:rgba(16,185,129,0.03)}
.has-complaint {background:rgba(56, 189, 248, 0.08) !important; border-left: 3px solid #38bdf8;}

.mass-panel-wrapper {position: sticky;top: 80px;z-index: 7;background: var(--bg);margin-bottom: 20px;}
.mass-panel{display:none;align-items:center;gap:12px;padding:15px 20px;border:1px solid var(--accent);border-radius:8px;background:var(--panel);box-shadow:var(--shadow);}
.downtime-badge {padding: 3px 8px;border-radius: 6px;font-size: 12px;font-weight: 700;white-space: nowrap;display:inline-block;min-width: 90px;text-align: center;}
.downtime-ok { background-color: var(--ok); color: white; }
.downtime-warn { background-color: var(--warn); color: var(--ink); }
.downtime-red { background-color: var(--red); color: white; }

@media print {
    #historicalAnalyticsSummary, #operativeSummary { display: block !important; border: 1px solid #000; padding: 15px; margin-bottom: 15px; }
    .report-grid, .summary-grid { display: block; }
    .report-item, .summary-card { margin-bottom: 10px; border: 1px solid #000; }
    details { display: block !important; }
    summary { display: none !important; }
    header, .topbar, .mass-panel-wrapper, .btn-print, .select-box, #checkAll, .btn-quick { display: none !important; }
    body > main { display: block !important; }
    main { padding: 0 !important; }
    table { margin-top: 0 !important; }
    table th, table td { border: 1px solid #000 !important; padding: 6px !important; }
    .is-out, .ok { background: #fff !important; }
}
</style>
</head>
<body>

<header>
  <h1>Теплосеть: Аналитика и Отчеты <span class="muted">(Режим чтения)</span></h1>
  <div class="topbar">
    <div class="badge">Всего домов: <span id="totalCount">0</span></div>
    <div class="badge badge-red">Отключено: <span id="offCount">0</span></div>
    <div class="badge badge-loss">Потери: <span id="lossCount">0.000</span> Гкал/ч</div>
    
    <input type="text" id="q" placeholder="Поиск (адрес, ТК, примечание)" style="width:250px">
    <select id="filter_by_owner"><option value="all">Все владельцы</option><option value="our">Наш</option><option value="consumer">Физ. лицо</option><option value="juridical">Юр. лицо</option></select>
    <select id="filter_by_source"><option value="all">Все Источники</option><option value="TETs1">ТЭЦ-1</option><option value="TETs2">ТЭЦ-2</option><option value="RK3">РК-3</option><option value="BMK92">БМК-92</option><option value="BMK93">БМК-93</option><option value="BMKAero">БМК Аэропорт</option><option value="BMKAA">БМК Алтын Арман</option><option value="BMKBereke">БМК Береке</option><option value="BMKKunai">БМК Кунай</option><option value="BMKDruzhba">БМК Дружба</option><option value="OTHER">Другой</option></select>
    
    <label><input type="checkbox" id="filter_off_only" style="margin-right:5px"> Только откл.</label>
    <label style="color:#38bdf8; font-weight:bold;"><input type="checkbox" id="filter_complaints" style="margin-right:5px"> 🗣️ Жалобы</label>
    
    <span style="border-left:1px solid var(--line); margin: 0 5px; padding-left: 12px;"></span>
    <button class="btn-quick" id="btnQuickLastMonth">Месяц</button>
    <button class="btn-quick" id="btnQuickLastQuarter">Квартал</button>
    <button class="btn-quick" id="btnQuickLast6Months">6 Месяцев</button>
    
    <input type="date" id="filter_history_start" style="width:130px">
    <input type="date" id="filter_history_end" style="width:130px">
    <button id="btnToggleHistoryMode" class="btn-warn">📊 Анализ периода</button>
    
    <button id="btnPrint" class="btn-ok" style="margin-left:auto;">🖨️ Печать отчета</button>
  </div>
</header>

<main>
    <div class="mass-panel-wrapper">
        <div id="massActionPanel" class="mass-panel">
            <div style="font-weight:600">Выделено строк: <span id="selectedCount">0</span> (только для визуального контроля)</div>
            <button id="massClear" class="btn-warn">❌ Снять выделение</button>
        </div>
    </div>
    
    <div id="operativeSummary" class="panel" style="display:none;"></div>

    <div id="historicalAnalyticsSummary" class="panel" style="display:none;"></div>
    
    <div class="panel">
        <table style="table-layout:auto;">
            <thead>
                <tr>
                    <th style="width:30px"><input type="checkbox" id="checkAll"></th> 
                    <th>Адрес</th>
                    <th style="width:80px">ТК</th>
                    <th style="width:100px">Источник</th>
                    <th style="width:180px">Открытые Жалобы</th>
                    <th style="width:100px; text-align:right">Нагрузка</th>
                    <th style="width:100px">ID Порыва</th> 
                    <th style="width:130px">Начало Откл.</th>
                    <th style="width:100px">Простой (ч)</th>
                </tr>
            </thead>
            <tbody id="houseList"></tbody>
        </table>
    </div>
</main>

<script>
// --- ПОДКЛЮЧАЕМ ЕДИНУЮ БАЗУ ДАННЫХ (IndexedDB) ---
const IDB = {
    dbName: 'TeploNetworkDB',
    version: 1,
    init: function() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.version);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('data')) {
                    db.createObjectStore('data');
                }
            };
            request.onsuccess = (e) => resolve(e.target.result);
            request.onerror = (e) => reject(e.target.error);
        });
    },
    get: async function(key) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('data', 'readonly');
            const store = tx.objectStore('data');
            const request = store.get(key);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }
};

const DB_NAME = 'teplo_houses_v3';
const LS_OUTAGES = 'teplo_outages_v3';
const LS_COMPLAINTS = 'teplo_complaints_v3'; 
const NORMATIVE_HOURS = 24; 

let houses = []; let outages = []; let complaints = [];
let selectedIds = new Set();
let statusMap = new Map();
let complaintsMap = new Map();
let isHistoricalMode = false; 

const $ = id => document.getElementById(id);
const els = {
    list: $('houseList'),
    total: $('totalCount'), off: $('offCount'), loss: $('lossCount'),
    reportSummary: $('historicalAnalyticsSummary'), 
    operativeSummary: $('operativeSummary'),
    filters: { q: $('q'), offOnly: $('filter_off_only'), compsOnly: $('filter_complaints'), byOwner: $('filter_by_owner'), bySource: $('filter_by_source'), historyStart: $('filter_history_start'), historyEnd: $('filter_history_end'), btnToggle: $('btnToggleHistoryMode') },
    quickBtns: { lastMonth: $('btnQuickLastMonth'), lastQuarter: $('btnQuickLastQuarter'), last6Months: $('btnQuickLast6Months') }
};

const getSourceDisplay = (code) => ({'TETs1': 'ТЭЦ-1', 'TETs2': 'ТЭЦ-2', 'RK3': 'РК-3', 'BMK92': 'БМК-92', 'BMK93': 'БМК-93', 'BMKAero': 'БМК Аэропорт', 'BMKAA': 'БМК Алтын Арман', 'BMKBereke': 'БМК Береке', 'BMKKunai': 'БМК Кунай', 'BMKDruzhba': 'БМК Дружба', 'OTHER': 'Другой'}[code] || '—');
const formatDate = (iso) => iso ? new Date(iso).toLocaleDateString('ru-RU') : '—';
const formatTime = (iso) => iso ? new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '—';

function calculateDowntime(startISO) {
    if (!startISO) return { hours: 0, status: 'ok' }; 
    const hours = (new Date().getTime() - new Date(startISO).getTime()) / (1000 * 60 * 60); 
    return { hours: Math.max(0, hours), status: hours >= NORMATIVE_HOURS ? 'red' : (hours >= NORMATIVE_HOURS * 0.5 ? 'warn' : 'ok') }; 
}

function calculateHistoricalDowntime(hid, startFilterMs, endFilterMs) { 
    let totalHours = 0; let outageCount = 0; 
    // Конец фильтра = конец дня (23:59:59)
    const endFilterEndMs = endFilterMs + 86399999;
    const houseOutages = outages.filter(o => o.houseId === hid && new Date(o.start).getTime() <= endFilterEndMs); 
    
    houseOutages.forEach(o => { 
        const startMs = new Date(o.start).getTime(); 
        const endMs = o.actualEnd ? new Date(o.actualEnd).getTime() : new Date().getTime(); 
        
        const effectiveStartMs = Math.max(startMs, startFilterMs); 
        const effectiveEndMs = Math.min(endMs, endFilterEndMs); 
        
        if (effectiveEndMs > effectiveStartMs) { 
            totalHours += (effectiveEndMs - effectiveStartMs) / (1000 * 60 * 60); 
            outageCount++; 
        } 
    }); 
    return { totalHours, outageCount }; 
}

function setQuickDateFilter(mode) { 
    const endDate = new Date(); endDate.setDate(0); 
    let startMonth = endDate.getMonth(); let startYear = endDate.getFullYear();
    if (mode === 'quarter') startMonth -= 2; else if (mode === '6months') startMonth -= 5; 
    while (startMonth < 0) { startMonth += 12; startYear -= 1; }
    const startDate = new Date(startYear, startMonth, 1);
    const formatDateInput = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; 
    els.filters.historyStart.value = formatDateInput(startDate); els.filters.historyEnd.value = formatDateInput(endDate); 
    toggleHistoryMode(true); 
} 

// ИЗМЕНЕНО НА АСИНХРОННУЮ ЗАГРУЗКУ ИЗ IDB
async function loadData() { 
    houses = await IDB.get(DB_NAME) || [];
    outages = await IDB.get(LS_OUTAGES) || [];
    complaints = await IDB.get(LS_COMPLAINTS) || [];
    updateStats(); renderList(); 
} 

function updateStats() { 
    statusMap.clear(); complaintsMap.clear();
    let lostLoad = 0;
    
    outages.filter(o => !o.actualEnd).forEach(o => {
        statusMap.set(o.houseId, o);
        const house = houses.find(h => h.id === o.houseId);
        if (house && house.load) lostLoad += Number(house.load);
    }); 
    
    complaints.filter(c => c.state === 'open').forEach(c => {
        if (!complaintsMap.has(c.houseId)) complaintsMap.set(c.houseId, []);
        complaintsMap.get(c.houseId).push(c);
    });
    
    els.total.textContent = houses.length; 
    els.off.textContent = statusMap.size; 
    els.loss.textContent = lostLoad.toFixed(3);

    if (statusMap.size > 0 && !isHistoricalMode) {
        const grouped = {};
        statusMap.forEach((outage, hid) => {
            const h = houses.find(x => x.id === hid);
            if (h) {
                const src = h.source || 'OTHER';
                if (!grouped[src]) grouped[src] = { count: 0, loss: 0, addresses: [] };
                grouped[src].count++;
                if (h.load) grouped[src].loss += Number(h.load);
                grouped[src].addresses.push(`${h.street}, ${h.house}${h.block||''}`);
            }
        });

        let summaryHtml = `<h3>Текущая оперативная сводка (онлайн):</h3><div class="summary-grid">`;
        for (const [src, data] of Object.entries(grouped).sort((a,b) => b[1].count - a[1].count)) {
            summaryHtml += `
            <div class="summary-card">
                <b style="color:var(--red); font-size:16px;">${getSourceDisplay(src)}</b><br>
                Отключено: <b>${data.count} шт.</b><br>
                <span style="font-size:12px; color:var(--muted)">Потери нагрузки: <b>${data.loss.toFixed(3)} Гкал/ч</b></span>
                <details>
                    <summary>Показать адреса (${data.count})</summary>
                    <div style="font-size:12px; color:var(--ink); line-height:1.6; padding-top:4px;">
                        ${data.addresses.join('; ')}
                    </div>
                </details>
            </div>`;
        }
        summaryHtml += `</div>`;
        els.operativeSummary.innerHTML = summaryHtml;
        els.operativeSummary.style.display = 'block';
    } else {
        els.operativeSummary.style.display = 'none';
    }
} 

function filterList() {
    const q = (els.filters.q.value || '').toLowerCase().trim();
    const filterOff = els.filters.offOnly.checked; const filterComps = els.filters.compsOnly.checked;
    const filterOwner = els.filters.byOwner.value; const filterSource = els.filters.bySource.value;
    return houses.filter(h => {
        if (filterOff && !statusMap.has(h.id)) return false;
        if (filterComps && !complaintsMap.has(h.id)) return false;
        if (filterOwner !== 'all' && h.owner !== filterOwner) return false;
        if (filterSource !== 'all' && h.source !== filterSource) return false;
        if (q && !`${h.street} ${h.house} ${h.tk} ${h.note}`.toLowerCase().includes(q)) return false;
        return true;
    }).sort((a, b) => {
        if (complaintsMap.has(a.id) && !complaintsMap.has(b.id)) return -1;
        if (!complaintsMap.has(a.id) && complaintsMap.has(b.id)) return 1;
        if (statusMap.has(a.id) && !statusMap.has(b.id)) return -1;
        if (!statusMap.has(a.id) && statusMap.has(b.id)) return 1;
        return a.street.localeCompare(b.street);
    });
}

function generateHistoricalReport(filteredList) { 
    if (!isHistoricalMode) { els.reportSummary.style.display = 'none'; return; } 
    let totalOutages = 0; let totalHours = 0; const sourceStats = {}; 
    filteredList.forEach(h => { 
        totalOutages += h.outagesInPeriod; totalHours += h.historicalDowntimeHours; 
        const source = h.source || 'OTHER'; 
        if (!sourceStats[source]) sourceStats[source] = { hours: 0, count: 0 }; 
        sourceStats[source].hours += h.historicalDowntimeHours; sourceStats[source].count += h.outagesInPeriod; 
    }); 
    const sortedSources = Object.keys(sourceStats).map(key => ({ code: key, ...sourceStats[key], display: getSourceDisplay(key) })).sort((a, b) => b.hours - a.hours); 
    els.reportSummary.innerHTML = ` 
        <h2>Сводный Отчет Анализа: ${els.filters.historyStart.value} – ${els.filters.historyEnd.value}</h2> 
        <div class="report-grid">
            <div class="report-item"><p>Всего домов в отчете:</p><span class="report-value" style="color:var(--accent)">${filteredList.length}</span></div>
            <div class="report-item"><p>Общее кол-во отключений:</p><span class="report-value">${totalOutages}</span></div>
            <div class="report-item"><p>Суммарный простой (ч):</p><span class="report-value">${totalHours.toFixed(1)}</span></div>
        </div>
        <h3 style="margin-top:20px;">Простой по Источникам</h3>
        <div class="source-list">${sortedSources.map(s => `<p> <b>${s.display}:</b> <span>${s.hours.toFixed(1)} ч (${s.count} откл.)</span> </p>`).join('')}</div>
    `; 
    els.reportSummary.style.display = 'block'; 
}

function renderList() {
    updateStats();
    let list = filterList().map(h => {
        if (isHistoricalMode) {
            const startMs = new Date(els.filters.historyStart.value).getTime();
            const endMs = new Date(els.filters.historyEnd.value).getTime();
            const { totalHours, outageCount } = calculateHistoricalDowntime(h.id, startMs, endMs);
            h.historicalDowntimeHours = totalHours; h.outagesInPeriod = outageCount;
        }
        return h;
    });

    const headerRow = els.list.parentElement.querySelector('thead tr');
    const checkAllHtml = `<th style="width:30px"><input type="checkbox" id="checkAll"></th>`;
    
    if (isHistoricalMode) {
        list = list.filter(h => h.outagesInPeriod > 0);
        generateHistoricalReport(list); 
        headerRow.innerHTML = `
            ${checkAllHtml} 
            <th>Адрес</th><th style="width:80px">ТК</th><th style="width:100px">Источник</th><th style="width:100px; text-align:right">Нагрузка</th>
            <th style="width:130px">Отключений (шт)</th><th style="width:130px">Простой (ч)</th><th></th>
        `;
        list.sort((a, b) => b.historicalDowntimeHours - a.historicalDowntimeHours);
    } else {
        els.reportSummary.style.display = 'none'; 
        headerRow.innerHTML = `
            ${checkAllHtml} 
            <th>Адрес</th><th style="width:80px">ТК</th><th style="width:100px">Источник</th><th style="width:180px">Открытые Жалобы</th>
            <th style="width:100px; text-align:right">Нагрузка</th><th style="width:100px">ID Порыва</th><th style="width:130px">Начало Откл.</th><th style="width:100px">Простой (ч)</th>
        `;
    }

    const frag = document.createDocumentFragment();
    list.forEach(h => {
        const tr = document.createElement('tr');
        const out = statusMap.get(h.id);
        const houseComplaintsArray = complaintsMap.get(h.id);
        const downtime = out ? calculateDowntime(out.start) : { hours: 0, status: 'ok' };
        
        tr.className = out ? 'is-out' : 'ok';
        if (houseComplaintsArray && houseComplaintsArray.length > 0) tr.classList.add('has-complaint');
        
        const isChecked = selectedIds.has(String(h.id)) ? 'checked' : '';
        const checkbox = `<input type="checkbox" data-id="${h.id}" class="select-box" ${isChecked}>`;
        const loadDisplay = h.load ? parseFloat(h.load).toFixed(3) : '0.000'; 
        
        if (isHistoricalMode) {
            tr.innerHTML = `<td>${checkbox}</td><td>${h.street}, ${h.house}${h.block || ''}</td><td>${h.tk || '—'}</td><td>${getSourceDisplay(h.source)}</td><td style="text-align:right">${loadDisplay}</td><td style="text-align:center">${h.outagesInPeriod}</td><td style="text-align:center"><b style="color:var(--red);">${h.historicalDowntimeHours.toFixed(1)} ч</b></td><td></td>`;
        } else {
            let downtimeBadge = out ? `<span class="downtime-badge downtime-${downtime.status}">${downtime.hours.toFixed(1)} ч</span>` : '';
            let compDisplay = '—';
            if (houseComplaintsArray && houseComplaintsArray.length > 0) {
                compDisplay = houseComplaintsArray.map(c => `
                    <div style="margin-bottom:4px; padding-bottom:4px; border-bottom:1px solid rgba(0,0,0,0.05);">
                        <b style="color:#38bdf8; font-size:12px;">${c.type}</b><br>
                        <span style="font-size:11px; color:var(--muted)">от ${formatDate(c.date)}</span>
                    </div>
                `).join('');
            }

            tr.innerHTML = `<td>${checkbox}</td><td>${h.street}, ${h.house}${h.block || ''}</td><td>${h.tk || '—'}</td><td>${getSourceDisplay(h.source)}</td><td>${compDisplay}</td><td style="text-align:right">${loadDisplay}</td><td>${out && out.ruptureId ? out.ruptureId : '—'}</td><td>${out ? `${formatDate(out.start)} ${formatTime(out.start)}` : '—'}</td><td>${downtimeBadge}</td>`;
        }
        frag.appendChild(tr);
    });
    els.list.innerHTML = ''; els.list.appendChild(frag);
    
    const checkAll = $('checkAll');
    if (checkAll) checkAll.checked = list.length > 0 && list.every(h => selectedIds.has(String(h.id)));
}

function toggleHistoryMode(force) { 
    isHistoricalMode = force !== undefined ? force : !isHistoricalMode; 
    const btn = els.filters.btnToggle; 
    if (isHistoricalMode) { 
        // ЗАЩИТА ОТ ПУСТЫХ ДАТ
        if (!els.filters.historyStart.value || !els.filters.historyEnd.value) {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            const formatDateInput = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            els.filters.historyStart.value = formatDateInput(firstDay);
            els.filters.historyEnd.value = formatDateInput(today);
        }
        
        btn.textContent = '✅ Режим Анализа (ВКЛ)'; btn.classList.replace('btn-warn', 'btn-danger'); 
        els.filters.offOnly.checked = false; els.filters.offOnly.disabled = true; els.filters.compsOnly.checked = false; els.filters.compsOnly.disabled = true;
    } else { 
        btn.textContent = '📊 Анализ периода'; btn.classList.replace('btn-danger', 'btn-warn'); 
        els.filters.offOnly.disabled = false; els.filters.compsOnly.disabled = false;
    } 
    renderList(); 
} 

function updateMassPanel() {
    $('selectedCount').textContent = selectedIds.size;
    $('massActionPanel').style.display = selectedIds.size > 0 ? 'flex' : 'none';
}

els.list.addEventListener('change', (e) => {
    if (e.target.classList.contains('select-box')) {
        const id = String(e.target.dataset.id);
        if (e.target.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        updateMassPanel();
        
        const allBoxes = document.querySelectorAll('.select-box');
        $('checkAll').checked = allBoxes.length > 0 && Array.from(allBoxes).every(cb => cb.checked);
    }
});

document.addEventListener('change', (e) => {
    if (e.target.id === 'checkAll') {
        const isChecked = e.target.checked;
        document.querySelectorAll('.select-box').forEach(cb => {
            cb.checked = isChecked;
            const id = String(cb.dataset.id);
            if (isChecked) selectedIds.add(id);
            else selectedIds.delete(id);
        });
        updateMassPanel();
    }
});

$('massClear').onclick = () => {
    selectedIds.clear();
    const checkAll = $('checkAll');
    if (checkAll) checkAll.checked = false;
    document.querySelectorAll('.select-box').forEach(cb => cb.checked = false);
    updateMassPanel();
};

document.addEventListener('DOMContentLoaded', loadData);
['q', 'filter_by_owner', 'filter_off_only', 'filter_complaints', 'filter_by_source'].forEach(id => $(id).addEventListener('input', renderList));
els.filters.btnToggle.onclick = () => toggleHistoryMode(); 
els.filters.historyStart.onchange = () => { if(isHistoricalMode) renderList(); };
els.filters.historyEnd.onchange = () => { if(isHistoricalMode) renderList(); };
els.quickBtns.lastMonth.onclick = () => setQuickDateFilter('month');
els.quickBtns.lastQuarter.onclick = () => setQuickDateFilter('quarter');
els.quickBtns.last6Months.onclick = () => setQuickDateFilter('6months');
$('btnPrint').onclick = () => window.print();
</script>
</body>
</html>
