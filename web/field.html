<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>КТЭК — бригада</title><style>body{max-width:850px;margin:auto;padding:16px;background:#f1f5f9;font:15px system-ui;color:#172554}header{display:flex;justify-content:space-between;align-items:center}section{background:#fff;padding:16px;border-radius:10px;margin:12px 0;box-shadow:0 1px 5px #cbd5e1}label{font-size:12px;font-weight:bold;display:block;margin-top:7px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:9px;margin-top:3px}button{background:#1677b8;border:0;color:#fff;border-radius:5px;font-weight:bold}.task{padding:10px;border-bottom:1px solid #ddd}.offline{color:#c2410c;font-weight:bold}</style><body><header><h1>🔧 Планшет бригады</h1><a href="/">Диспетчерская</a></header><section><b id=state>Проверка сети…</b><div id=tasks>Загрузка заданий…</div></section><section><h2>Фиксация дефекта</h2><form id=f><label>Источник<input name=source></label><label>Дата обнаружения<input name=dateObserved type=datetime-local required></label><label>Камера / ТК<input name=tk required></label><label>Адрес<input name=address></label><label>Классификация<select name=defectType><option>Течь</option><option>Коррозия</option><option>Нарушение изоляции</option><option>Затопление камеры</option></select></label><label>Тип сети<select name=networkType><option>Внутриквартальная</option><option>Магистраль</option></select></label><label>Критичность (1–10)<input name=priority type=number min=1 max=10 value=5></label><label>Примечание<textarea name=note></textarea></label><label>Фото<input name=photos type=file accept="image/*" multiple></label><button>Передать дефект</button></form></section><section><h2>GPS-корректировка топологии</h2><label>Node ID<input id=nodeId placeholder="N123"></label><label>Примечание<textarea id=topologyNote></textarea></label><button onclick="saveGps()">Получить GPS и отправить корректировку</button><div id=gps></div></section><script>const dbp=()=>new Promise(ok=>{let r=indexedDB.open('ktek_offline_v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{autoIncrement:true});r.onsuccess=()=>ok(r.result)});async function add(x){let d=await dbp();d.transaction('q','readwrite').objectStore('q').add(x)}async function all(){let d=await dbp();return new Promise(ok=>{let r=d.transaction('q').objectStore('q').getAll();r.onsuccess=()=>ok(r.result)})}async function wipe(){let d=await dbp();d.transaction('q','readwrite').objectStore('q').clear()}async function sync(){if(!navigator.onLine)return;let x=await all();for(let y of x)await fetch(y.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(y.body)});if(x.length)await wipe()}function status(){state.textContent=navigator.onLine?'Онлайн · синхронизация включена':'Офлайн · записи сохраняются в защищённой очереди устройства';state.className=navigator.onLine?'':'offline'}async function loadTasks(){let x=await fetch('/api/field/tasks').then(r=>r.json());tasks.innerHTML='<h2>План-график осмотров</h2>'+x.map(t=>`<div class=task><b>${t.title}</b><br>${new Date(t.planned_at).toLocaleString('ru')} · Приоритет ${t.priority}<br><small>${t.node_name||t.node_id}</small><button onclick="finish('${t.id}')">Зафиксировать осмотр</button></div>`).join('')}async function finish(id){let note=prompt('Результат осмотра / комментарий','Осмотр выполнен');let pos=await new Promise(ok=>navigator.geolocation?navigator.geolocation.getCurrentPosition(x=>ok(x.coords),()=>ok({})):ok({}));let fd=new FormData;fd.append('worker','Бригада №1');fd.append('result','Выполнено');fd.append('note',note||'');fd.append('lat',pos.latitude||'');fd.append('lon',pos.longitude||'');await fetch('/api/field/tasks/'+id+'/complete',{method:'POST',body:fd});loadTasks()}f.dateObserved.value=new Date().toISOString().slice(0,16);f.onsubmit=async e=>{e.preventDefault();let fd=new FormData(f);if(navigator.onLine){await fetch('/api/field/defects',{method:'POST',body:fd});alert('Дефект передан диспетчеру')}else{await add({url:'/api/field/defects',body:Object.fromEntries([...fd.entries()].filter(([,v])=>typeof v==='string'))});alert('Офлайн: текстовые данные добавлены в очередь. Фотографии будут добавлены при восстановлении связи.')}f.reset()};async function saveGps(){let n=nodeId.value;if(!n)return alert('Укажите Node ID');navigator.geolocation.getCurrentPosition(async p=>{await fetch('/api/field/topology-edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nodeId:n,lat:p.coords.latitude,lon:p.coords.longitude,note:topologyNote.value})});gps.textContent='Корректировка передана: '+p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6)},()=>gps.textContent='GPS недоступен: проверьте разрешение устройства')};addEventListener('online',()=>{status();sync()});addEventListener('offline',status);status();sync();loadTasks();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js')</script></body></html>
