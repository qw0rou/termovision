<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КТЭК — администрирование</title><style>body{max-width:1100px;margin:auto;background:#f1f5f9;font:14px system-ui;padding:16px;color:#172554}section{background:#fff;padding:16px;margin:12px 0;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #dbeafe}input,select,button{padding:7px}button{background:#2563eb;color:white;border:0;border-radius:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.two{grid-template-columns:1fr}}</style><body><a href="/">← Диспетчерская</a><h1>Администрирование и качество данных</h1><div class=two><section><h2>Пороги аналитики</h2><table id=thr></table></section><section><h2>Новый тип узла</h2><input id=typeName placeholder="Например, воздушник"><input id=typeColor type=color value="#64748b"><button onclick="addType()">Добавить тип</button><div id=types></div></section><section><h2>Поля цифрового паспорта</h2><select id=fieldEntity><option value=node>Камера/узел</option><option value=house>Дом</option></select><input id=fieldKey placeholder="Ключ поля"><input id=fieldLabel placeholder="Название поля"><button onclick="addField()">Добавить поле</button><div id=fields></div></section><section><h2>Смежные коммуникации</h2><select id=utilType><option>Кабельная линия</option><option>Водопровод</option><option>Канализация</option></select><input id=lat placeholder="Широта"><input id=lon placeholder="Долгота"><input id=utilNote placeholder="Примечание"><button onclick="addUtility()">Добавить на карту</button></section></div><section><h2>Очередь ручной привязки ТК</h2><small>Нераспознанные связи не подменяются автоматически. Введите ID узла из карты и подтвердите.</small><table id=un><tr><th>Тип</th><th>ID</th><th>Исходное ТК</th><th>Узел</th></tr></table></section><script>const j=(u,o)=>fetch(u,o).then(r=>r.json());async function load(){let c=await j('/api/admin/config');thr.innerHTML='<tr><th>Показатель</th><th>Мин</th><th>Макс</th><th></th></tr>'+c.thresholds.map(x=>`<tr><td>${x.label}</td><td><input id=a${x.key} value=${x.min}></td><td><input id=b${x.key} value=${x.max}></td><td><button onclick="saveT('${x.key}')">Сохранить</button></td></tr>`).join('');types.innerHTML=c.types.map(x=>`<p>${x.name} <span style=color:${x.color}>●</span></p>`).join('');fields.innerHTML=c.fields.map(x=>`<p>${x.entity_type}: ${x.label}</p>`).join('');let u=await j('/api/admin/unmatched');un.innerHTML+='<tbody>'+u.map(x=>`<tr><td>${x.entity_type}</td><td>${x.entity_id}</td><td>${x.tk_raw}</td><td><input id=n${x.id} placeholder="N123"><button onclick="link(${x.id})">Связать</button></td></tr>`).join('')+'</tbody>'}function post(u,b){return j(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}function saveT(k){return j('/api/admin/thresholds/'+k,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({min:+a[k].value,max:+b[k].value})})}async function addType(){await post('/api/admin/node-types',{name:typeName.value,color:typeColor.value});load()}async function addField(){await post('/api/admin/passport-fields',{entityType:fieldEntity.value,key:fieldKey.value,label:fieldLabel.value});load()}async function addUtility(){await post('/api/utilities',{type:utilType.value,lat:+lat.value,lon:+lon.value,note:utilNote.value});alert('Добавлено')}async function link(i){await post('/api/admin/unmatched/'+i,{nodeId:document.querySelector('#n'+i).value});load()}load()</script></body></html>
